site_name: QAnsiTextViewer
site_description: QAnsiTextViewer is a PySide6/PyQt log-viewer widget for Python that renders ANSI escape codes and colored terminal output.
site_author: Tanishq Kumar
site_url: https://tanishq-kumar.github.io/QAnsiTextViewer/
repo_url: https://github.com/tanishq-kumar/QAnsiTextViewer
repo_name: GitHub

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  font:
    text: Atkinson Hyperlegible
    code: Courier Prime
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra:
  version_label: v0.1.2

extra_css:
  - stylesheets/listing.css

extra_javascript:
  - javascripts/feed.js

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.keys
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

plugins:
  - search
  - social:
      # Card PNGs need Cairo (see CI apt step). Rendering defaults OFF so
      # Cairo-free machines still build; CI opts in with MKDOCS_SOCIAL_CARDS=true.
      # Cards + meta tags are deploy artifacts — they only exist in CI output.
      cards: !ENV [MKDOCS_SOCIAL_CARDS, false]
      cards_layout_options:
        background_color: "#2e6b3a"
        color: "#ffffff"
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_symbol_type_heading: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source
            inherited_members: false

nav:
  - Use:
      - Home: index.md
      - Your first log pane: guides/first-log-pane.md
      - Streaming process output: guides/streaming.md
      - Themes and colors: guides/theming.md
      - Visual tour: gallery.md
  - Reference:
      - Viewer: api/viewer.md
      - Highlighting: api/highlighting.md
      - Internals: api/internals.md
  - Appendix:
      - Troubleshooting: troubleshooting.md
      - Changelog: changelog.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
