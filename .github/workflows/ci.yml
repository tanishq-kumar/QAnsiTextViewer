name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# Rapid pushes on a PR cancel the superseded run; pushes to main/develop run to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    env:
      MKDOCS_SOCIAL_CARDS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install Cairo for social cards
        run: |
          mkdir -p "$HOME/apt-cache/partial"
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-cache" libcairo2
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Check lockfile is in sync
        run: uv lock --check
      - name: Audit dependencies
        run: uv run --no-sync pip-audit
      - name: Ruff check
        run: uvx ruff@0.16.7 check ansi_text_viewer demo.py main.py tests
      - name: Ruff format check
        run: uvx ruff@0.16.7 format --check ansi_text_viewer demo.py main.py tests
      - name: mypy
        run: uv run --no-sync mypy ansi_text_viewer
      - name: ty
        run: uv run --no-sync ty check ansi_text_viewer
      - name: Build docs
        run: uv run --no-sync mkdocs build --strict

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: [static]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Cache Qt runtime libs
        if: runner.os == 'Linux'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/apt-cache
          key: apt-qt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-qt-
      - name: Install Qt runtime libs
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/apt-cache/partial"
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-cache" \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Run tests
        run: uv run --no-sync pytest -p no:cacheprovider -q
