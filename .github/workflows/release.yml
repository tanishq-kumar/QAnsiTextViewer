name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.2.0)."
        required: true

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Pinned to actions/checkout v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # Pinned to astral-sh/setup-uv v10.1.0.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - name: Build distributions
        run: uv build
      - name: Check distributions
        run: uv run --with twine twine check dist/*
      - name: Extract release notes
        run: |
          python - <<'EOF'
          import os
          import re

          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## \[{re.escape(version)}\].*?\n(.*?)(?=^## \[|\Z)",
              text,
              re.S | re.M,
          )
          if not match:
              raise SystemExit(f"No CHANGELOG entry for [{version}]")
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(match.group(1).strip() + "\n")
          EOF
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              dist/*
          else
            gh release upload "$TAG" dist/* --clobber
          fi

  publish-pypi:
    name: publish-pypi
    needs: release
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      # Pinned to actions/checkout v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Pinned to astral-sh/setup-uv v10.1.0.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - name: Build distributions
        run: uv build
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
