[project]
name = "qansitextviewer"
version = "0.1.0"
description = "A Qt-based viewer for ANSI-encoded text files."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "PySide6>=6.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch]
build.include = [
  "ansi_text_viewer",
]
